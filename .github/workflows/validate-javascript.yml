name: Validate JavaScript lessons

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and example smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find javascript -type f -name '*.js' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript lesson files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check JavaScript lesson security patterns
        run: node scripts/check-js-security.mjs

      - name: Run lesson examples
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t examples < <(find javascript -type f -name 'examples.js' | sort)
          if [ "${#examples[@]}" -eq 0 ]; then
            echo "No lesson examples found."
            exit 1
          fi
          for file in "${examples[@]}"; do
            echo "Running $file"
            node "$file"
          done
